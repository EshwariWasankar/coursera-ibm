apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: oc-final-
spec:
  pipelineRef:
    name: oc-final
  params:
    - name: repo-url
      value: https://github.com/EshwariWasankar/coursera-ibm.git
    - name: revision
      value: main
    - name: image
      value: REPLACE_WITH_REGISTRY_IMAGE
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: pipeline-workspace
