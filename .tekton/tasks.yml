apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: clean-workspace
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -eu
        git clone --depth 1 --branch "$(params.revision)" \
          "$(params.url)" "$(workspaces.source.path)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir -r requirements-dev.txt
        flake8 .
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --no-cache-dir -r requirements-dev.txt
        nosetests --verbosity=2
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.image)" .
        buildah push --storage-driver=vfs "$(params.image)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: apply-and-wait
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        sed "s|image-to-be-set-by-pipeline|$(params.image)|" \
          openshift/deployment.yaml | oc apply -f -
        oc rollout status deployment/coursera-sample --timeout=180s
